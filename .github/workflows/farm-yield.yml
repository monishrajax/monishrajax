name: Farm yield

# Re-grows the contribution "crop yield" graph (assets/yield.svg) and refreshes the
# repository table in README.md. Pure Python standard library, no secrets to set up.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:           # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/update_yield.py"
      - "scripts/farmlib.py"
      - "scripts/farm_*.json"
      - "scripts/farm_*.py"
      - ".github/workflows/farm-yield.yml"

permissions:
  contents: write

concurrency:
  group: farm-yield
  cancel-in-progress: true

jobs:
  yield:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Grow the yield graph
        env:
          # Optional: add a repo secret PROFILE_TOKEN (classic PAT, scope read:user) to count private contributions.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/update_yield.py

      - name: Commit changes
        run: |
          git config user.name "farm-bot"
          git config user.email "farm-bot@users.noreply.github.com"
          git add assets/yield.svg README.md
          if git diff --cached --quiet; then
            echo "Nothing new to harvest."
          else
            git commit -m "chore(farm): sync crop yield $(date -u +%F)"
            git push
          fi
